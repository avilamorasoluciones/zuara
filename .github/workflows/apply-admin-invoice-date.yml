name: Apply admin invoice date update

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply-update:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply backend and frontend changes
        shell: python
        run: |
          from pathlib import Path

          app = Path("app.py")
          text = app.read_text(encoding="utf-8")

          old = "conn.execute('''CREATE TABLE IF NOT EXISTS ventas (id SERIAL PRIMARY KEY, consecutivo TEXT, fecha_registro TEXT, cliente_nombre TEXT, cliente_telefono TEXT, direccion_entrega TEXT, total_eur REAL, total_bs REAL DEFAULT 0, tasa_bcv_euro_aplicada REAL, tasa_binance_aplicada REAL, porcentaje_brecha_aplicado REAL, estado TEXT, registrado_por TEXT, metodo_pago TEXT)''')"
          new = "conn.execute('''CREATE TABLE IF NOT EXISTS ventas (id SERIAL PRIMARY KEY, consecutivo TEXT, fecha_registro TEXT, fecha_facturacion TEXT, cliente_nombre TEXT, cliente_telefono TEXT, direccion_entrega TEXT, total_eur REAL, total_bs REAL DEFAULT 0, tasa_bcv_euro_aplicada REAL, tasa_binance_aplicada REAL, porcentaje_brecha_aplicado REAL, estado TEXT, registrado_por TEXT, metodo_pago TEXT)''')"
          assert old in text, "No se encontró el CREATE TABLE de ventas"
          text = text.replace(old, new, 1)

          old = "safe_alter(conn, \"ALTER TABLE ventas ADD COLUMN metodo_pago TEXT DEFAULT ''\")"
          new = old + "\n        safe_alter(conn, \"ALTER TABLE ventas ADD COLUMN fecha_facturacion TEXT DEFAULT ''\")\n        conn.execute(\"UPDATE ventas SET fecha_facturacion = split_part(fecha_registro, ' ', 1) WHERE COALESCE(fecha_facturacion, '') = ''\")"
          assert old in text, "No se encontró la migración de ventas"
          text = text.replace(old, new, 1)

          marker = "def validar_fecha_tasa(fecha):\n    \"\"\"Acepta únicamente fechas reales en formato ISO YYYY-MM-DD.\"\"\"\n    if not isinstance(fecha, str):\n        return False\n    try:\n        return datetime.datetime.strptime(fecha, '%Y-%m-%d').date().isoformat() == fecha\n    except (TypeError, ValueError):\n        return False\n"
          helper = marker + "\n\ndef fecha_sistema_venezuela():\n    \"\"\"Fecha operativa del sistema en zona Venezuela, independiente de UTC del servidor.\"\"\"\n    return datetime.datetime.now(ZoneInfo('America/Caracas')).strftime('%Y-%m-%d')\n"
          assert marker in text, "No se encontró validar_fecha_tasa"
          text = text.replace(marker, helper, 1)

          old = "            ahora = datetime.datetime.now().strftime(\"%Y-%m-%d %H:%M:%S\")\n            d = request.json\n            c_nombre = d.get('cliente_nombre', '').strip()"
          new = """            ahora = datetime.datetime.now().strftime("%Y-%m-%d %H:%M:%S")
            d = request.json
            c_nombre = d.get('cliente_nombre', '').strip()

            # La tasa usada en una nota de entrega siempre corresponde al día
            # operativo del sistema. La fecha personalizada solo cambia la fecha
            # del documento y, por seguridad, solo puede elegirla un administrador.
            hoy_sistema = fecha_sistema_venezuela()
            es_admin_facturacion = es_administrador_actual()
            fecha_facturacion = d.get('fecha_facturacion', hoy_sistema) if es_admin_facturacion else hoy_sistema
            if not validar_fecha_tasa(fecha_facturacion):
                return jsonify({'error': 'La fecha de facturación no es válida. Selecciona una fecha real.'}), 400

            tasa_hoy = conn.execute(
                "SELECT fecha, hora, binance, euro_bcv FROM historico_tasas WHERE fecha = ? ORDER BY hora DESC LIMIT 1",
                (hoy_sistema,)
            ).fetchone()
            if not tasa_hoy:
                return jsonify({'error': 'No existe una tasa oficial registrada para el día del sistema.'}), 400

            tasa_euro_sistema = float(tasa_hoy['euro_bcv'] or 0)
            tasa_binance_sistema = float(tasa_hoy['binance'] or 0)
            brecha_sistema = (tasa_binance_sistema / tasa_euro_sistema) - 1 if tasa_euro_sistema > 0 else 0
            if tasa_euro_sistema <= 0:
                return jsonify({'error': 'La tasa Euro BCV del día del sistema no es válida.'}), 400"""
          assert old in text, "No se encontró el inicio de api_ventas"
          text = text.replace(old, new, 1)

          old = "            conn.execute('INSERT INTO ventas (consecutivo, fecha_registro, cliente_nombre, cliente_telefono, direccion_entrega, total_eur, total_bs, tasa_bcv_euro_aplicada, tasa_binance_aplicada, porcentaje_brecha_aplicado, estado, registrado_por, metodo_pago) VALUES (?,?,?,?,?,?,?,?,?,?,?,?,?)',\n                          (consec_venta, ahora, c_nombre, d.get('cliente_telefono',''), d.get('env_direccion',''), total_eur, total_bs, safe_float(d.get('tasa_bcv_euro')), safe_float(d.get('tasa_binance')), safe_float(d.get('brecha_dia')), d.get('estado_semaforo','EMITIDA'), usuario_actual, d.get('metodo_pago', '')))"
          new = "            conn.execute('INSERT INTO ventas (consecutivo, fecha_registro, fecha_facturacion, cliente_nombre, cliente_telefono, direccion_entrega, total_eur, total_bs, tasa_bcv_euro_aplicada, tasa_binance_aplicada, porcentaje_brecha_aplicado, estado, registrado_por, metodo_pago) VALUES (?,?,?,?,?,?,?,?,?,?,?,?,?,?)',\n                          (consec_venta, ahora, fecha_facturacion, c_nombre, d.get('cliente_telefono',''), d.get('env_direccion',''), total_eur, total_bs, tasa_euro_sistema, tasa_binance_sistema, brecha_sistema, d.get('estado_semaforo','EMITIDA'), usuario_actual, d.get('metodo_pago', '')))"
          assert old in text, "No se encontró INSERT de ventas"
          text = text.replace(old, new, 1)

          old = "            for item in d['detalles']:\n                consec_mov = f\"MOV-{str(num_m).zfill(5)}\"\n                conn.execute('''INSERT INTO movimientos (consecutivo, fecha_registro, tipo, producto_id, cantidad, costo_unitario, documento, registrado_por) VALUES (?,?,?,?,?,?,?,?)''',\n                              (consec_mov, ahora, 'Venta', item['producto_id'], safe_float(item['cantidad']), safe_float(item.get('precio_eur')), consec_venta, usuario_actual))"
          new = "            hora_movimiento = ahora.split(' ', 1)[1] if ' ' in ahora else '00:00:00'\n            fecha_movimiento = f\"{fecha_facturacion} {hora_movimiento}\"\n            for item in d['detalles']:\n                consec_mov = f\"MOV-{str(num_m).zfill(5)}\"\n                conn.execute('''INSERT INTO movimientos (consecutivo, fecha_registro, tipo, producto_id, cantidad, costo_unitario, documento, registrado_por) VALUES (?,?,?,?,?,?,?,?)''',\n                              (consec_mov, fecha_movimiento, 'Venta', item['producto_id'], safe_float(item['cantidad']), safe_float(item.get('precio_eur')), consec_venta, usuario_actual))"
          assert old in text, "No se encontró INSERT de movimientos de venta"
          text = text.replace(old, new, 1)

          app.write_text(text, encoding="utf-8")

          js = Path("static/main.js")
          main = js.read_text(encoding="utf-8")
          extra = Path("static/admin_invoice_date.js").read_text(encoding="utf-8")
          if "admin_invoice_date.js" not in main:
              main = main.rstrip() + "\n\n" + extra.rstrip() + "\n"
          old = "        nc_id: nc_id\n    };"
          new = "        nc_id: nc_id,\n        fecha_facturacion: document.getElementById('v_fecha_facturacion')?.value || ''\n    };"
          assert old in main, "No se encontró payload de procesarVenta"
          main = main.replace(old, new, 1)
          js.write_text(main, encoding="utf-8")

          Path("static/admin_invoice_date.js").unlink(missing_ok=True)

      - name: Validate syntax
        shell: bash
        run: |
          python -m py_compile app.py
          node --check static/main.js

      - name: Commit update
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.py static/main.js static/admin_invoice_date.js
          git diff --cached --quiet && exit 0
          git commit -m "feat: fecha personalizada de facturación para administradores [skip ci]"
          git push
